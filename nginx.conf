server {
    listen 80;
    listen [::]:80;
    server_name expensify.xently.co.ke;

    access_log off;
    
    location /.well-known {
        allow all;
    }
    
    location / {
        return 301 https://expensify.xently.co.ke$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name expensify.xently.co.ke;

    index index.php index.html;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
    
    ssl_certificate /etc/letsencrypt/live/expensify/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/expensify/privkey.pem;
    ssl_dhparam /sites/.config/expensify/ssl/dhparams.pem;
    
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options nosniff;
    add_header Strict-Transport-Security "max-age=31536000";
    
    root /repos/expensify;
    
    location /api/ {
        include snippets/fastcgi-php.conf;
        fastcgi_param PARTNER_NAME "applicant";
        fastcgi_param PARTNER_PASSWORD "d7c3119c6cdab02d68d9";
        fastcgi_pass unix:/run/php/php8.1-fpm.sock;
        include /etc/nginx/fastcgi_params;
    }
}